<body>
    <header>
        <div class="header-content">
            <h1>Tech Community</h1>
            <span class="menu-icon" onclick="toggleMenu()">&#9776; Menu</span>
        </div>
    </header>

    <div id="sideNav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="toggleMenu()">&times;</a>
            <div class="sidenav-links">

    <div class="container">
        <h1 style="text-align: center;">Silahkan isi identitas anda disini</h1>
            <form action="index.html" class="form-card">
            <div class="input-group">
                <label for="nama">Nama</label>
                <input type="text" name="name" id="nama" placeholder="Masukkan Nama Lengkap Anda">
            </div>
            <div class="input-group">
                <label for="usia">Usia</label>
                <input type="number" name="usia" id="usia" placeholder="Masukkan Usia Anda">
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Masukkan Email Anda">
            </div>
            <div class="input-group">
                <label for="bidang-minat">Bidang Minat</label>
                <select name="bidang-minat" id="bidang-minat">
                    <option value="">Pilih Bidang Minat</option>
                    <option value="web-development">Web Development</option>
                    <option value="mobile-development">Mobile Development</option>
                    <option value="data-science">Cyber Security</option>
                </select>
            </div>
            <button type="submit">Kirim</button>
        </form>
    </div>
