<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Tech Community</h1>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./gallery.html">Gallery</a></li>
                <li><a href="./form.html">Form</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="media-container">
            <h2>Kumpulan video</h2>
            <div class="card">
                <h3>Dokumentasi Gambar</h3>
                <div class="image-box">
                    <img src="gambar1.jpg" alt="Foto Komunitas">
                    <img src="gambar2.jpg" alt="Foto Komunitas">
                    <img src="gambar3.jpg" alt="Foto Komunitas">
                </div>
                <button onclick="gantiGambar()" class="btn-action">Ganti Gambar</button>
            </div>
            <div class="card">
                <h3>Podcast Tech</h3>
                <audio id="myAudio">
                    <source src="audio1.m4a" type="audio/mp4">
                </audio>
                <div class="controls">
                    <button onclick="playAudio()" class="btn-play">Play</button>
                    <button onclick="pauseAudio()" class="btn-pause">Pause</button>
                </div>
            </div>

            <div class="card">
                <div class="video-grid">
            <div class="card video-card">
                <h4>Mobile Dev</h4>
                <video id="videoMobile"><source src="mobile dev.mp4" type="video/mp4"></video>
                <div class="controls">
                    <button onclick="controlVideo('videoMobile', 'play')" class="btn-play">Play</button>
                    <button onclick="controlVideo('videoMobile', 'stop')" class="btn-stop">Stop</button>
                </div>
            </div>
            <div class="card video-card">
                <h4>Web Dev</h4>
                <video id="videoWeb"><source src="web dev.mp4" type="video/mp4"></video>
                <div class="controls">
                    <button onclick="controlVideo('videoWeb', 'play')" class="btn-play">Play</button>
                    <button onclick="controlVideo('videoWeb', 'stop')" class="btn-stop">Stop</button>
                </div>
            </div>
            <div class="card video-card">
                <h4>Cyber Security</h4>
                <video id="videoCyber"><source src="cyber.mp4" type="video/mp4"></video>
                <div class="controls">
                    <button onclick="controlVideo('videoCyber', 'play')" class="btn-play">Play</button>
                    <button onclick="controlVideo('videoCyber', 'stop')" class="btn-stop">Stop</button>
                </div>
            </div>

        </div>
            
        </section>
    </main>
    <audio src=""></audio>
    <script src="script.js"></script>
</body>

</html>
