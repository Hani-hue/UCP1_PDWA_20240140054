<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Tech Community</h1>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./gallery.html">Gallery</a></li>
                <li><a href="./form.html">Form</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="media-container">
            <h2>Kumpulan video</h2>
            <div class="card">
                <h3>Dokumentasi Gambar</h3>
                <div class="image-box">
                    <img src="gambar1.jpg" alt="Foto Komunitas">
                    <img src="gambar2.jpg" alt="Foto Komunitas">
                    <img src="gambar3.jpg" alt="Foto Komunitas">
                </div>
                <button onclick="gantiGambar()" class="btn-action">Ganti Gambar</button>
            </div>

            <div class="card">
                <h3>Video Tutorial</h3>
                <div class="video-box">
                    <div class="card video-card">
                        <h4>Mobile Development</h4>
                        <video id="videoMobile"></video><video src="mobile dev.mp4" type="video/mp4"></video>
                        <div class="controls">
                            <button onclick="playVideo('videoMobile', 'play')" class="btn-action">Play</button>
                            <button onclick="pauseVideo('videoMobile', 'pause')" class="btn-action">Pause</button>
                        </div>
                    </div>
                </div>

            </div>
            
        </section>
    </main>
    <audio src=""></audio>
    <a href="./index.html">Kembali ke Home</a>
</body>

</html>
